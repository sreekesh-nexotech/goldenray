# Runs the whole stack: PostgreSQL + Django backend + Blog CMS + Next.js frontend.
#
#   docker compose up -d          # start everything
#   docker compose down           # stop everything
#   docker compose up -d --build  # rebuild after code/dependency changes
#
# The root .env file is auto-loaded and supplies the DB credentials + API URL.
# Django's own secrets (SECRET_KEY, Twilio, etc.) come from goldenray-backend/.env
# via `env_file`, which is passed to the container literally (never interpolated).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Read by initdb/01-create-cms-db.sh to name the CMS database.
      CMS_DB_NAME: ${CMS_DB_NAME:-blog_cms}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on a fresh data volume: creates the blog_cms database so the
      # cms service can migrate into it. Ordered by filename (01-…).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./goldenray-backend/backend
    # The .env is mounted (not passed via env_file) so Django's own load_dotenv()
    # reads it verbatim — this avoids Compose interpolating the "$" in SECRET_KEY.
    # The values set under `environment` below are already in the process env, so
    # load_dotenv() (override=False) leaves them as-is — that's how we point Django
    # at the containerised DB while everything else comes from the mounted file.
    volumes:
      - ./goldenray-backend/.env:/app/.env:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    # Host port 8012 — 8000, 8010 and 8011 are used by other projects on this
    # shared VM.
    ports:
      - "8012:8000"
    depends_on:
      db:
        condition: service_healthy

  # Blog CMS (Content Studio backend). Standalone Django service — its own
  # project (config.wsgi), Postgres DB, and image. The browser calls it directly
  # on host port 8009 (delivery API + Django admin authoring UI), same as it
  # calls the main backend on :8010.
  cms:
    build: ./goldenray-backend/backend/cms
    # Like `backend`, the .env is mounted (not env_file) so the CMS's own
    # load_dotenv() reads it verbatim — avoids Compose interpolating any "$" in
    # secrets. Values under `environment` are already in the process env, so
    # load_dotenv(override=False) leaves them as-is: that's how we point the CMS
    # at the containerised DB while everything else comes from the mounted file.
    volumes:
      - ./goldenray-backend/backend/cms/.env:/app/.env:ro
      # Local media fallback (BunnyCDN handles images when configured, but keep
      # uploads durable across restarts either way).
      - cms_uploads:/app/uploads
    environment:
      # Local Docker is plain HTTP on :8009, so default to development —
      # production mode enables SECURE_SSL_REDIRECT and 301s every API call to
      # https. Override with CMS_DJANGO_ENV=production behind real TLS.
      DJANGO_ENV: ${CMS_DJANGO_ENV:-development}
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${CMS_DB_NAME:-blog_cms}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_ALLOWED_HOSTS: ${CMS_ALLOWED_HOSTS:-localhost,127.0.0.1,cms}
    # The blog_cms database is created by the db container's init script
    # (see ./initdb/), so here we just migrate and serve. Static (admin UI) is
    # already collected into the image.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    # Host port 8009 — the frontend's NEXT_PUBLIC_ADMIN_API_BASE_URL points here.
    ports:
      - "8009:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-reachable backend URL, baked into the client bundle at build.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        # Content Studio admin API (blog CMS on host port 8009), also called
        # directly from the browser. Point at the deployed CMS in production
        # (e.g. https://blog.flarize.com/admin-api/).
        NEXT_PUBLIC_ADMIN_API_BASE_URL: ${NEXT_PUBLIC_ADMIN_API_BASE_URL:-http://localhost:8009/admin-api/}
        # Public delivery API the /blog pages read. Must be passed here or the
        # Dockerfile's localhost default gets baked in and the blog shows nothing.
        NEXT_PUBLIC_BLOG_API_BASE_URL: ${NEXT_PUBLIC_BLOG_API_BASE_URL:-http://localhost:8009/api}
    environment:
      # Server-side only (no NEXT_PUBLIC_ prefix), so it is read at runtime and
      # must be in the container env — .dockerignore excludes .env* from the
      # image. Authenticates the CMS's on-demand revalidation ping; must match
      # the CMS's FRONTEND_REVALIDATE_SECRET or the webhook 401s and the blog
      # only refreshes on the hourly ISR window.
      BLOG_REVALIDATE_SECRET: ${BLOG_REVALIDATE_SECRET}
    # Host port 3003 — 3000/3001 are used by other projects on this shared VM.
    ports:
      - "3003:3000"
    depends_on:
      - backend
      - cms

volumes:
  pgdata:
  cms_uploads:
