<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Ray BOM — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0F172A;
      color: #F8FAFC;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    h1 { font-size: 22px; font-weight: 400; color: #F59E0B; }
    p  { font-size: 14px; color: #64748B; }
    a  {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 20px;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 6px;
      color: #F59E0B;
      text-decoration: none;
      font-size: 13px;
    }
    a:hover { background: rgba(245,158,11,0.2); }
  </style>
</head>
<body>
  <h1>Golden Ray BOM</h1>
  <p>Welcome, {{ request.user.username }}.</p>
  <form method="post" action="{% url 'bom:logout' %}">
    {% csrf_token %}
    <button type="submit" style="background:none;border:none;cursor:pointer;padding:0;">
      <a style="pointer-events:none;">Sign Out</a>
    </button>
  </form>
</body>
</html>
